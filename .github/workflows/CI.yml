name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app

    - name: Build
      run: xcodebuild clean build -scheme BLENearbyExchange -destination 'platform=iOS Simulator,name=iPhone 17'

    - name: Test
      run: |
        xcodebuild test \
          -scheme BLENearbyExchange \
          -destination 'platform=macOS' \
          -skipPackagePluginValidation
  format:
    runs-on: xcode-27
    steps:
    - uses: actions/checkout@v4

    - name: Install SwiftFormat
      run: brew install swiftformat

    - name: Lint
      run: swiftformat --lint --reporter github-actions-log .
